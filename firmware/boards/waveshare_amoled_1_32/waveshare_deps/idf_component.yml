# Waveshare ESP32-S3-Touch-AMOLED-1.32 only. Exact version; supports ESP-IDF 6.0.
# Public, so main (which requires this component) gets its headers.
dependencies:
  # CO5300 AMOLED over QSPI (panel.c). 2.1.0 is the version the reference project ran on this board.
  espressif/esp_lcd_co5300:
    version: "2.1.0"
    require: public
